name: CI - tests, security & agent evaluation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # Workload Identity Federation for the live eval job (no JSON keys)

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests || true
      - name: Unit + integration tests (offline, deterministic)
        run: pytest -q

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=terraform init -backend=false && terraform -chdir=terraform validate

  live-agent-eval:
    # Runs the golden dataset against real Gemini; gated on WIF being configured.
    needs: unit-tests
    if: ${{ vars.GCP_WIF_PROVIDER != '' }}
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_LOCATION: global
      GOOGLE_GENAI_USE_VERTEXAI: "true"
      BUDDY_RUN_LIVE_EVAL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_EVAL_SERVICE_ACCOUNT }}
      - run: pip install -e ".[dev]"
      - name: Golden dataset evaluation (fails below 85% pass rate)
        run: python -m tests.eval.run_evaluation --judge --min-pass-rate 0.85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval_results.json
