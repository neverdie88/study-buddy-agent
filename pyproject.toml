[project]
name = "study-buddy-agent"
version = "1.0.0"
description = "Pip the Study Buddy - a voice + whiteboard ADK multi-agent tutor and calendar helper for kids."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "google-adk[db]>=2.12,<3",
    "google-genai>=2.30,<3",
    "fastapi>=0.133,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.12,<3",
    "aiosqlite>=0.21",
    "sqlalchemy[asyncio]>=2,<3",
    "python-json-logger>=3",
    "opentelemetry-sdk>=1.39",
    "opentelemetry-exporter-gcp-trace>=1.9",
    "google-cloud-logging>=3.11",
    "google-cloud-dlp>=3.25",
    "google-cloud-secret-manager>=2.20",
    "google-cloud-firestore>=2.19",
    "google-api-python-client>=2.157",
]

[project.optional-dependencies]
vertex-search = ["google-cloud-discoveryengine>=0.13"]
model-armor = ["google-cloud-modelarmor>=0.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
